name: Cleanup deleted branch

on:
  delete:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.ref_type == 'branch'

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Get deleted branch name
        id: branch
        run: |
          BRANCH_NAME=${{ github.event.ref }}
          SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/\//-/g')
          echo "name=$SAFE_BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Deleted branch: $SAFE_BRANCH_NAME"

      - name: Remove branch directory
        run: |
          if [ -d "${{ steps.branch.outputs.name }}" ]; then
            rm -rf "${{ steps.branch.outputs.name }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Remove ${{ steps.branch.outputs.name }} (branch deleted)"
            git push
          else
            echo "Directory ${{ steps.branch.outputs.name }} does not exist"
          fi
