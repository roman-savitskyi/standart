name: Update index page

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages", "Cleanup deleted branch"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Generate index.html
        run: |
          # Отримуємо список всіх папок (бранчів)
          BRANCHES=$(find . -maxdepth 1 -type d ! -name '.' ! -name '.git' -printf '%f\n' | sort)

          cat > index.html << 'HEADER'
          <!DOCTYPE html>
          <html lang="uk">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Презентації - Стандартизація</title>
              <style>
                  * { box-sizing: border-box; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                      max-width: 800px;
                      margin: 0 auto;
                      padding: 2rem;
                      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                      min-height: 100vh;
                      color: #eee;
                  }
                  h1 {
                      color: #00d9ff;
                      border-bottom: 2px solid #00d9ff;
                      padding-bottom: 0.5rem;
                  }
                  .branch-list {
                      list-style: none;
                      padding: 0;
                  }
                  .branch-list li {
                      margin: 0.5rem 0;
                  }
                  .branch-list a {
                      display: block;
                      padding: 1rem 1.5rem;
                      background: rgba(255,255,255,0.1);
                      border-radius: 8px;
                      color: #fff;
                      text-decoration: none;
                      transition: all 0.3s ease;
                      border: 1px solid transparent;
                  }
                  .branch-list a:hover {
                      background: rgba(0,217,255,0.2);
                      border-color: #00d9ff;
                      transform: translateX(10px);
                  }
                  .main-badge {
                      background: #00d9ff;
                      color: #1a1a2e;
                      padding: 0.2rem 0.5rem;
                      border-radius: 4px;
                      font-size: 0.8rem;
                      margin-left: 0.5rem;
                  }
              </style>
          </head>
          <body>
              <h1>Презентації курсу "Стандартизація"</h1>
              <ul class="branch-list">
          HEADER

          for branch in $BRANCHES; do
              if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then
                  echo "        <li><a href=\"./$branch/\">$branch <span class=\"main-badge\">основна</span></a></li>" >> index.html
              else
                  echo "        <li><a href=\"./$branch/\">$branch</a></li>" >> index.html
              fi
          done

          cat >> index.html << 'FOOTER'
              </ul>
          </body>
          </html>
          FOOTER

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Update index.html"
          git push
